[package]
name = "fleetos-control"
version = "0.1.0"
edition = "2024"

[lib]
name = "fleetos_control"
path = "src/lib.rs"

[[bin]]
name = "fleetos_control"
path = "src/main.rs"

[features]
default = []
tempfile = ["dep:tempfile"]
test-helpers = ["dep:tempfile"]

[dependencies]
fleetos-core = { version = "0.1.0", path = "../fleetos-core" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
openraft = { version = "0.9.25", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = "0.14.6"
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "4.1.0"
tempfile = { version = "3.27.0", optional = true }
chacha20poly1305 = "0.11.0"
ring = "0.17.14"
