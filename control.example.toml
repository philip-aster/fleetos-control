# =============================================================================
# fleetos-control configuration
# =============================================================================

[node]
name = "control-1"

# -----------------------------------------------------------------------------
# Cluster / Raft
# -----------------------------------------------------------------------------
# mode:
#   "bootstrap" — one-time, first control node. Generates both CA roots,
#                 forms a single-node Raft cluster. Never run this twice.
#   "join"      — all subsequent control nodes. Attest, get SVID, request
#                 membership, catch up via snapshot, promote to voter.
[cluster]
mode = "bootstrap"

# For join mode only: Data/Control address of an existing control node.
# join_target = "10.0.1.1:9443"

# For join mode only: raft transport address of an existing control node.
# join_raft_target = "10.0.1.1:9445"

# For join mode only: single-use join token from AdminService.GenerateJoinToken.
# join_token = ""

# For bootstrap mode: initial Raft membership (single node).
# NOTE: address MUST be the raft transport address (listeners.raft),
# not the Data/Control address.
[[cluster.initial_members]]
id = 1
address = "10.0.1.1:9445"


# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
[storage]
# Local disk only. Fjall uses a directory, not a single file.
# Never a network filesystem.
fjall_path = "/var/lib/fleetos/control_db"

# -----------------------------------------------------------------------------
# Trust domains (two independent CAs)
# -----------------------------------------------------------------------------
[trust_domains]
# Data/Control overlay: control ↔ agent/router/gateway, Raft peers.
data_control = "fleet.example.internal"

# Admin overlay: fleetctl ↔ fleetctl-proxy ↔ control.
admin = "fleet-admin.example.internal"

# -----------------------------------------------------------------------------
# SVID TTL policy (owned by fleetos-control, not fleetos-core)
# -----------------------------------------------------------------------------
[svid]
workload_ttl_secs = 3600       # 1 hour
node_ttl_secs = 3600           # 1 hour
admin_ttl_secs = 86400         # 24 hours
delegated_key_ttl_secs = 14400 # 4 hours
refresh_fraction = 0.75        # refresh at 75% elapsed

# -----------------------------------------------------------------------------
# Dummy-IP allocation
# -----------------------------------------------------------------------------
[dummy_ip]
# Outer address space (fixed for v1).
space = "240.0.0.0/4"

# Per-tenant block size. Default /16 = 65,536 addresses per tenant,
# supporting up to 4,096 tenants within the /4 space.
# Do NOT set to /8 (exhausts the entire space after 16 tenants).
tenant_block_prefix = 16

# -----------------------------------------------------------------------------
# Secrets at-rest encryption
# -----------------------------------------------------------------------------
[secrets]
# Path to the master key file (FileMasterKey for v1).
master_key_path = "/var/lib/fleetos/master.key"

# ---------------------------------------------------------------------------
# Attestation
# ---------------------------------------------------------------------------
[attestation]
# TTL for single-use join tokens (M-2 custody). Tokens are the sole gate to
# cluster membership until hardware-quote verification lands, so they expire.
join_token_ttl_secs = 3600

# -----------------------------------------------------------------------------
# gRPC listeners
# -----------------------------------------------------------------------------
[listeners]
# Data/Control overlay: PolicyService, WatchService, SchedulerService,
# RouterAssignmentService, SecretService, AttestationService, CaService.
data_control = "10.0.1.1:9443"

# Admin overlay: AdminService only (gated to `ctrl` SVID kind).
admin = "10.0.1.1:9444"

# Raft peer RPC (internal, `control`-kind SVIDs).
raft = "10.0.1.1:9445"

# -----------------------------------------------------------------------------
# Health / lease configuration
# -----------------------------------------------------------------------------
[health]
# Seconds after which a node with no heartbeat is evicted.
node_lease_timeout_secs = 3600
# Interval between node health checks.
node_check_interval_secs = 15
# Interval between pod reconciliation checks.
pod_check_interval_secs = 20

# -----------------------------------------------------------------------------
# Provisioning
# -----------------------------------------------------------------------------
[provisioning]
# gRPC endpoint of the cloud provider shim.
# Empty string means provisioning is disabled.
endpoint = ""
provision_poll_interval_secs = 30
